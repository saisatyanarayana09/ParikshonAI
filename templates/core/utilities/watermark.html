{% extends "workspace_base.html" %}
{% block title %}Watermark PDF | Parikshon AI{% endblock %}
{% block workspace_content %}
<div class="workspace-main" style="overflow-y: auto; padding: 2rem; display: flex; flex-direction: column; align-items: center;">
    <h1 class="header-title" style="font-size: 2.5rem; margin-bottom: 1rem;">Watermark PDF</h1>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">Stamp a text watermark over your PDF.</p>
    
    <div style="background: var(--surface); border: var(--border-thick); padding: 2rem; box-shadow: var(--shadow); width: 100%; max-width: 600px;">
        <form method="POST" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 1.5rem;">
            {% csrf_token %}
            <label style="font-weight: bold;">Upload File(s)</label>
            <input type="file" name="file" required accept=".pdf" style="padding: 1rem; border: var(--border); background: var(--bg); color: var(--text); width: 100%;">
        <label style="font-weight: bold; margin-top: 0.5rem;">Watermark Text</label>
        <input type="text" name="text" placeholder="e.g. CONFIDENTIAL" required style="padding: 1rem; border: var(--border); background: var(--bg); color: var(--text); width: 100%;">
        <label style="font-weight: bold; margin-top: 0.5rem;">Position</label>
        <select name="position" style="padding: 1rem; border: var(--border); background: var(--bg); color: var(--text); width: 100%;">
            <option value="center">Center</option>
            <option value="top-left">Top Left</option>
            <option value="top-right">Top Right</option>
            <option value="bottom-left">Bottom Left</option>
            <option value="bottom-right">Bottom Right</option>
        </select>
        <label style="font-weight: bold; margin-top: 0.5rem;">Opacity</label>
        <select name="opacity" style="padding: 1rem; border: var(--border); background: var(--bg); color: var(--text); width: 100%;">
            <option value="50">50%</option>
            <option value="25">25%</option>
            <option value="75">75%</option>
            <option value="100">100%</option>
        </select>
        <label style="font-weight: bold; margin-top: 0.5rem;">Rotation</label>
        <select name="rotation" style="padding: 1rem; border: var(--border); background: var(--bg); color: var(--text); width: 100%;">
            <option value="45">45 Degrees</option>
            <option value="0">0 Degrees (Horizontal)</option>
            <option value="90">90 Degrees (Vertical)</option>
            <option value="-45">-45 Degrees</option>
        </select>
            <button type="submit" class="primary-btn" style="width: 100%; padding: 1rem; font-size: 1.2rem; cursor: pointer; margin-top: 1rem;">Execute</button>
        </form>
    </div>
</div>
{% endblock %}
