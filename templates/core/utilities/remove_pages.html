{% extends "workspace_base.html" %}
{% block title %}Remove Pages | Parikshon AI{% endblock %}
{% block workspace_content %}
<div class="workspace-main" style="overflow-y: auto; padding: 2rem; display: flex; flex-direction: column; align-items: center;">
    <h1 class="header-title" style="font-size: 2.5rem; margin-bottom: 1rem;">Remove Pages</h1>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">Delete specific unwanted pages from a PDF.</p>
    
    <div style="background: var(--surface); border: var(--border-thick); padding: 2rem; box-shadow: var(--shadow); width: 100%; max-width: 600px;">
        <form method="POST" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 1.5rem;">
            {% csrf_token %}
            <label style="font-weight: bold;">Upload File(s)</label>
            <input type="file" name="file" required accept=".pdf" style="padding: 1rem; border: var(--border); background: var(--bg); color: var(--text); width: 100%;"><input type="text" name="pages" placeholder="Comma-separated pages (e.g. 1, 4, 7)" required style="padding: 1rem; border: var(--border); background: var(--bg); color: var(--text); width: 100%;">
            <button type="submit" class="primary-btn" style="width: 100%; padding: 1rem; font-size: 1.2rem; cursor: pointer; margin-top: 1rem;">Execute</button>
        </form>
    </div>
</div>
{% endblock %}
