{% extends "workspace_base.html" %}
{% block title %}Split PDF | Parikshon AI{% endblock %}
{% block meta_tags %}
<meta name="description" content="Extract pages or separate a PDF into multiple smaller files.">
<meta name="keywords" content="split pdf, extract pdf pages, separate pdf">
{% endblock %}
{% block workspace_content %}
<div class="workspace-main" style="overflow-y: auto; padding: 2rem; display: flex; flex-direction: column; align-items: center;">
    <h1 class="header-title" style="font-size: 2.5rem; margin-bottom: 1rem;">Split PDF</h1>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">Extract pages or separate a PDF into multiple smaller files.</p>
    
    <div style="display: flex; gap: 2rem; width: 100%; max-width: 1200px; align-items: flex-start; flex-wrap: wrap;">
        
        

        <!-- Right Side: Form Options -->
        <div style="flex: 1; min-width: 300px; background: var(--surface); border: var(--border-thick); padding: 2rem; box-shadow: var(--shadow);">
            <form method="POST" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 1.5rem;">
                {% csrf_token %}
                <label style="font-weight: bold;">Upload File</label>
                <input type="file" name="file" id="pdf-upload" required accept=".pdf" style="padding: 1rem; border: var(--border); background: var(--bg); color: var(--text); width: 100%;">
        <label style="font-weight: bold; margin-top: 0.5rem;">Start Page</label>
        <input type="number" name="start_page" placeholder="e.g. 1" required style="padding: 1rem; border: var(--border); background: var(--bg); color: var(--text); width: 100%;">
        <label style="font-weight: bold; margin-top: 0.5rem;">End Page</label>
        <input type="number" name="end_page" placeholder="e.g. 5" required style="padding: 1rem; border: var(--border); background: var(--bg); color: var(--text); width: 100%;">
        <label style="font-weight: bold; margin-top: 0.5rem;">Mode</label>
        <select name="mode" style="padding: 1rem; border: var(--border); background: var(--bg); color: var(--text); width: 100%;">
            <option value="range">Extract as single PDF</option>
            <option value="single">Extract as ZIP of individual pages</option>
        </select>
                <button type="submit" class="primary-btn" style="width: 100%; padding: 1rem; font-size: 1.2rem; cursor: pointer; margin-top: 1rem;">Execute</button>
            </form>
        </div>

    </div>
</div>

{% endblock %}
