<div class="minimalist-bar-zone" data-upload-zone>
    <label class="bar-picker-label" id="upload-bar-label">
        <span class="bar-paperclip-icon">📎</span>
        <span class="bar-placeholder-text" data-file-meta>Attach a document — PDF, DOCX, PNG…</span>
        {{ form.file }}
    </label>
    <button class="bar-connect-btn" type="submit">Upload</button>
</div>
